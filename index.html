<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MAYUSO ETHICAL HACKING</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;700&family=Courier+Prime&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    
    <style>
        :root {
            --bg: #0a0a12;
            --accent: #ff0033;
            --text: #a0c8ff;
        }
        
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: 'Courier Prime', monospace;
            background: var(--bg);
            color: var(--text);
            overflow-x: hidden;
            height: 100vh;
        }

        /* Canvas Matrix Background */
        #matrix {
            position: fixed;
            top: 0; left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            opacity: 0.15;
        }

        /* NAV */
        nav {
            position: fixed;
            top: 0;
            width: 100%;
            background: rgba(0, 0, 0, 0.9);
            border-bottom: 2px solid var(--accent);
            z-index: 1000;
            padding: 15px 5%;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .logo-text {
            font-family: 'Orbitron', sans-serif;
            font-size: 1.7rem;
            color: white;
        }
        .nav-links a {
            color: var(--accent);
            text-decoration: none;
            margin-left: 28px;
            font-size: 1.1rem;
        }

        /* HERO - Logo centrado */
        .hero {
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            position: relative;
        }
        .hero img {
            width: 380px;
            max-width: 85%;
            filter: drop-shadow(0 0 35px var(--accent));
            margin-bottom: 30px;
        }
        .hero h1 {
            font-family: 'Orbitron', sans-serif;
            font-size: 3.2rem;
            color: white;
            margin-bottom: 10px;
        }
        .hero p {
            font-size: 1.35rem;
            color: var(--text);
        }
    </style>
</head>
<body>

    <!-- NAVEGACIÓN -->
    <nav>
        <div class="logo-text">MAYUSO <span style="color:var(--accent)">ETHICAL HACKING</span></div>
        <div class="nav-links">
            <a href="#">/HOME</a>
            <a href="#">/MENU</a>
            <a href="#">/PENTESTOOLS</a>
            <a href="#">/MUSIC</a>
            <a href="#">/WHOAMI</a>
        </div>
    </nav>

    <!-- Fondo Matrix -->
    <canvas id="matrix"></canvas>

    <!-- HERO -->
    <header class="hero">
        <img src="assets/img/mayured.png" alt="Mayuso Logo">
        <h1>ETHICAL HACKING</h1>
        <p>ASIR • Pentesting • OSINT • CTF</p>
    </header>

    <script>
        // Matrix Rain Effect
        const canvas = document.getElementById('matrix');
        const ctx = canvas.getContext('2d');

        canvas.height = window.innerHeight;
        canvas.width = window.innerWidth;

        const chars = '01アイウエオ0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZ';
        const fontSize = 14;
        const columns = canvas.width / fontSize;
        const drops = Array(Math.floor(columns)).fill(1);

        function draw() {
            ctx.fillStyle = 'rgba(10, 10, 18, 0.05)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            ctx.fillStyle = '#00aaff';
            ctx.font = `${fontSize}px monospace`;

            for (let i = 0; i < drops.length; i++) {
                const text = chars[Math.floor(Math.random() * chars.length)];
                ctx.fillText(text, i * fontSize, drops[i] * fontSize);

                if (drops[i] * fontSize > canvas.height && Math.random() > 0.975) {
                    drops[i] = 0;
                }
                drops[i]++;
            }
        }

        setInterval(draw, 35);

        window.addEventListener('resize', () => {
            canvas.height = window.innerHeight;
            canvas.width = window.innerWidth;
        });
    </script>

</body>
</html>
